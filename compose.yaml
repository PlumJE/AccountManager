services:
  account-manager:
    build:
      context: .
      dockerfile: dockerfile
      args:
        CONTAINER_NAME: ${CONTAINER_NAME}
    image: ${CONTAINER_NAME}
    container_name: ${CONTAINER_NAME}
    ports: 
      - "127.0.0.1:${VNC_PORT}:${VNC_PORT}"
    volumes: 
      - .:/home/user/hostcwd
    working_dir: /home/user/hostcwd
    environment:
      VNC_PORT: ${VNC_PORT}
    command: ["-i"]
    stdin_open: true
    tty: true
